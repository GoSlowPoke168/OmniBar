<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>OmniBar store screenshot</title>
  <!-- Maximized Chrome window (any 16:10 size, scaled to 1280x800 when captured): GitHub page on the left, the real OmniBar sidebar (sidebar.html) on the right -->
  <style>
    :root { --frame: #dee1e6; --toolbar: #ffffff; --omni: #f1f3f4; --text: #1f1f1f; --dim: #5f6368; --panel: #f8f9fa; }
    @media (prefers-color-scheme: dark) { :root { --frame: #1f2023; --toolbar: #35363a; --omni: #202124; --text: #e8eaed; --dim: #9aa0a6; --panel: #28292c; } }
    * { box-sizing: border-box; margin: 0; }
    body { width: 100vw; height: 100vh; overflow: hidden; background: var(--frame); color: var(--text); font: 12.5px system-ui, 'Segoe UI', sans-serif; }
    .tabs { height: 38px; display: flex; align-items: flex-end; padding: 0 10px; gap: 8px; }
    .tab { width: 240px; height: 32px; border-radius: 10px 10px 0 0; background: var(--toolbar); display: flex; align-items: center; gap: 8px; padding: 0 12px; }
    .tab img { width: 16px; height: 16px; }
    .newtab { height: 32px; display: flex; align-items: center; color: var(--dim); font-size: 18px; padding: 0 4px; }
    .winbtns { margin-left: auto; align-self: stretch; display: flex; }
    .winbtns span { width: 46px; display: grid; place-items: center; color: var(--text); font-size: 13px; }
    .bar { height: 42px; background: var(--toolbar); display: flex; align-items: center; gap: 10px; padding: 0 12px; }
    .nav { color: var(--dim); font-size: 16px; width: 22px; text-align: center; }
    .omni { flex: 1; height: 32px; border-radius: 16px; background: var(--omni); display: flex; align-items: center; padding: 0 14px; color: var(--text); font-size: 13.5px; }
    .ext { width: 22px; height: 22px; border-radius: 5px; }
    .content { display: flex; height: calc(100vh - 80px); }
    .page { width: calc(100vw - 440px); height: 100%; display: block; object-fit: cover; object-position: top left; }
    .side { width: 440px; flex: none; display: flex; flex-direction: column; background: var(--panel); border-left: 1px solid rgba(128, 128, 128, .25); }
    .side-head { height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 12px; font-weight: 600; font-size: 13px; }
    .side-head img { width: 16px; height: 16px; }
    .side-head span:last-child { margin-left: auto; color: var(--dim); font-weight: 400; font-size: 15px; }
    iframe { flex: 1; width: 100%; border: none; }
    /* Demo video only: drawn pointer (recordings don't show the real one) and closing title card */
    #cursor { position: fixed; left: 0; top: 0; width: 22px; z-index: 10; pointer-events: none; display: none;
              transition: transform 600ms cubic-bezier(.3, 0, .2, 1); filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .5)); }
    #cursor.click { animation: press 180ms ease; }
    @keyframes press { 50% { scale: .82; } }
    #endcard { position: fixed; inset: 0; z-index: 20; display: none; place-items: center; background: #1f1f1f; color: #ececec;
               font-family: 'Geist', system-ui, sans-serif; text-align: center; animation: fade 500ms ease; }
    #endcard img { width: 112px; }
    #endcard h1 { font-size: 64px; font-weight: 700; letter-spacing: -.02em; margin-top: 12px; }
    #endcard p { font-size: 24px; color: #b4b4b8; margin-top: 8px; }
    @keyframes fade { from { opacity: 0; } }
    @font-face { font-family: 'Geist'; src: url(/fonts/Geist-Variable.woff2) format('woff2'); font-weight: 100 900; }
  </style>
</head>

<body>
  <div class="tabs">
    <div class="tab"><img src="https://www.google.com/s2/favicons?domain=github.com&sz=32" alt="">GoSlowPoke168/OmniBar</div>
    <span class="newtab">+</span>
    <div class="winbtns"><span>&#x2014;</span><span>&#x2752;</span><span>&#x2715;</span></div>
  </div>
  <div class="bar">
    <span class="nav">←</span><span class="nav">→</span><span class="nav">↻</span>
    <div class="omni">github.com/GoSlowPoke168/OmniBar</div>
    <img class="ext" src="/icons/icon48.png" alt="">
  </div>
  <div class="content">
    <img class="page" id="page" alt="">
    <div class="side">
      <div class="side-head"><img src="/icons/icon16.png" alt="">OmniBar<span>✕</span></div>
      <iframe id="sidebar" src="/sidebar.html"></iframe>
    </div>
  </div>
  <svg id="cursor" viewBox="0 0 22 30"><path d="M2 2v22l6-5.5 4.2 9.3 3.6-1.6-4.1-9.1H20z" fill="#fff" stroke="#000" stroke-width="1.6" stroke-linejoin="round" /></svg>
  <div id="endcard"><div><img src="/icons/icon128.png" alt=""><h1>OmniBar</h1><p>Your favorite web apps, one click away in the side panel.</p></div></div>
  <script>
    const dark = matchMedia('(prefers-color-scheme: dark)').matches;
    document.getElementById('page').src = `bg-github-${dark ? 'dark' : 'light'}.png`;

    // Demo video helpers, driven by docs/store/record-demo.js
    const $cursor = document.getElementById('cursor');
    window.demo = {
      move(x, y) { $cursor.style.display = 'block'; $cursor.style.transform = `translate(${x - 2}px, ${y - 2}px)`; },
      press() { $cursor.classList.remove('click'); void $cursor.offsetWidth; $cursor.classList.add('click'); },
      end() { $cursor.style.display = 'none'; document.getElementById('endcard').style.display = 'grid'; }
    };
  </script>
</body>

</html>
