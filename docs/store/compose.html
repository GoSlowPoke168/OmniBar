<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>OmniBar store screenshot</title>
  <!-- 1280x800 full-screen Chrome: GitHub page on the left, the real OmniBar sidebar (sidebar.html) on the right -->
  <style>
    :root { --text: #1f1f1f; --dim: #5f6368; --panel: #f8f9fa; }
    @media (prefers-color-scheme: dark) { :root { --text: #e8eaed; --dim: #9aa0a6; --panel: #28292c; } }
    * { box-sizing: border-box; margin: 0; }
    body { width: 1280px; height: 800px; overflow: hidden; display: flex; color: var(--text); font: 12.5px system-ui, 'Segoe UI', sans-serif; }
    .page { width: 872px; height: 800px; display: block; object-fit: cover; object-position: top left; }
    .side { flex: 1; display: flex; flex-direction: column; background: var(--panel); border-left: 1px solid rgba(128, 128, 128, .25); }
    .side-head { height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 12px; font-weight: 600; font-size: 13px; }
    .side-head img { width: 16px; height: 16px; }
    .side-head span:last-child { margin-left: auto; color: var(--dim); font-weight: 400; font-size: 15px; }
    iframe { flex: 1; width: 100%; border: none; }
  </style>
</head>

<body>
  <img class="page" id="page" alt="">
  <div class="side">
    <div class="side-head"><img src="/icons/icon16.png" alt="">OmniBar<span>✕</span></div>
    <iframe id="sidebar" src="/sidebar.html"></iframe>
  </div>
  <script>
    const dark = matchMedia('(prefers-color-scheme: dark)').matches;
    document.getElementById('page').src = `bg-github-${dark ? 'dark' : 'light'}.png`;
  </script>
</body>

</html>
