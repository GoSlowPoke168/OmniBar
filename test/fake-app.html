<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Fake app</title>
  <style>
    body { margin: 0; font: 14px system-ui, sans-serif; background: #faf9f5; color: #222; display: flex; flex-direction: column; height: 100vh; }
    main { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .me { align-self: flex-end; background: #ebe8e0; padding: 8px 12px; border-radius: 12px; }
    textarea { margin: 12px; height: 44px; border-radius: 14px; border: 1px solid #ddd; padding: 10px; }
  </style>
</head>

<body>
  <main>
    <div class="me">How do I install an unpacked extension?</div>
    <p>Here's how to install an unpacked extension from GitHub: download the ZIP, extract it, then load it from chrome://extensions with Developer mode on.</p>
  </main>
  <textarea placeholder="Write a message…"></textarea>
</body>

</html>
